name: 页面问题
description: 报告无法访问、布局或跳转异常
title: "fix: "
labels:
  - bug
body:
  - type: textarea
    id: problem
    attributes:
      label: 问题
      description: 实际看到什么，预期是什么？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 浏览器与设备
      placeholder: 例如 Safari / iPhone 15
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 检查项
      options:
        - label: 我已移除账号、Cookie 和其他敏感信息。
          required: true
        - label: 我已搜索现有 Issue。
          required: true
